<!DOCTYPE html>
<html>
    <head>
        <title>Margin Top Example</title>
        <style>
            .box {
                margin-top: 50px;
                background-color: lightblue;
                padding: 20px;
                text-align: center;
                height: 100%;
                width: 100%;
                border: 1px solid black;

            }
            </style>
    </head>
    <body>
        <div class="box">
            <h1>Welcome to the Margin Top Example</h1>
            <p>This container has a top margin of 50 pixels.</p>
        </div>
</html>
