<!DOCTYPE html>
<html>
	<head>
		<title>links in css</title>
		<style>
			a:link{
				    color:green;
					font-size:18px;
				  }
			a:hover{
					 color:pink;
					 font-size:22px;
				   }
			a:active{
					 color:blue;
					 font-size:26px;
					}
			a:visited{
					  color:orange;
					  font-size:32px;
				     }
		</style>
	</head>
	<body>
		<a href="waterfall.jpg">waterfall</a>
		<a href="https://www.google.com"><img src="hanuman.jpg" alt="hanuman">google</a>

	</body>
</html>
