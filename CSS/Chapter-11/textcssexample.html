<!DOCTYPE html>
<html>
	<head>
		<title>css text example</title>
			<style>
				.text
				{
					color:blue;
					letter-spacing:2px;
					word-spacing:5px;
					text-indent:100px;
					text-transform:capitalize;
					text-decoration:line-through;
				}
			</style>
	</head>
	<body>
		<p class=text>"welcome css text property"
                        "welcome css text property"<br>
                        "welcome css text property"<br>
                        "welcome css text property"<br>
        </p>
	</body>
</html>
