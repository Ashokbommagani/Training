<!DOCTYPE html>
<html>
	<head>
		<title>table in css</title>
		<style>
			table,th,td{
						border:solid 2px black;
			}
			table{
				border-collaps:separate;
			}
			table{
				width:200px;
			}
			table{
				padding:20px;
			}
			th,td{
				border-spacing:2px;
			}
			tr:hover{
				background-color:white;
			}
			tr:nth-child(even){
				background-color: green;
			}
			tr:nth-child(odd){
				background-color: red;
			}
		</style>
	</head>

		<table>
			<tr>
				<th>name</th>
