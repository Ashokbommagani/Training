<!DOCTYPE html>
<html>
	<head>
		<title>student table css</title>
		<style>
			table,th,td{
					border:1px solid blue;
			}
			table{
			  border-collapse:separate;
			}
			table{
		      width:80%;
			}
			table{
			  padding:15px;
			}
			th,td{
		      border-spacing:10px;
			}
			tr:hover{
				background-color:yellow !important;
			}
			tr:nth-child(even){
				background-color: orange;
			}
			tr:nth-child(odd){
				background-color: pink;
			}
		</style
	</head>
