<!DOCTYPE html>
<html>
    <head>
        <title>OverflowExample</title>
        <style>
            .container{
            
                background-color: aqua;
                height:500px;

                border:2px solid blue ;
            }
            div{
                border:solid 2px green;

    </head>

        <div class="container">
            <div>box1</div>
            <div>box2 this  box content is more</div>
        </div>
        
    </body>
