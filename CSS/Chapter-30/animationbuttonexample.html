<!DOCTYPE html>>
<html>  
    <head>
        <title>animation with button Example</title>
        <style>
            @keyframes mybutton{
                from{
                    color:red;
                }
                to{
                    color:orangered;
                }
         }
        .well mybutton{
            animation-name:mybutton;
        }
        </style>
    </head>
    <body>
        <button class="well">welcome</button>
    </body>
</html>
