<!DOCTYPE html>
<html>
  <head>
      <title> this width and height example</title>
      <style>
         div{
           width: 500px;
           height: 300px;
           border: solid 1px black;
         }
         
         p{
            width: 10%;
            height: 10%;
            border: solid 1px red;
            max-width: 400px;
            max-height: 150px;
            min-width: 200px;
            min-height: 100px;  
            Overflow:auto;          
            /*1.overflow:auto;* :it displys scrollbar when content overflows i.e 1.if small content scrollbar not displays./
            /*2.overflow:scroll;* :it shows scrollbars when content overflows */
            /*3.overflow:hidden;* :it hides the content that exceeds the element's boundaries */

         }
      </style>
   </head>
   <body>
     <div>
          <p> 
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
               hi , how are you
            </p>
        </div>
    </body>
</html>
