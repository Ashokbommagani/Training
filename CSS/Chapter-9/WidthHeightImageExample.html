<!DOCTYPE html>
<html>
	<head>
		<title>Height and Width with Image Example</title>
		<style>
			div
			{
				width:700px;
				height:500px;
				border:3px solid yellow;
				background-color:orange;
			}
			img
			{
                min-width:100px;
                max-width:80%;
                min-height:200px;
                max-height:90%;
                overflow:auto;
			}
			h1
			{
				color:blue;
			}
		</style>
	</head>
	<body>
		<div>
			<h1>Image Example with Height and Width</h1>
			<img src="nature.jpg" alt="nature" title="nature" />
		</div>
	</body>
</html>
