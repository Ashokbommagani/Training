<!DOCTYPE html>
<html>
	<head>
		<title>CSS GRIDS</title>
		<style>
			.P {
                display:grid;
                grid-template-columns: 100PX 200PX;
                grid-template-rows: 100px 300px 100PX;
				border:solid 2px black;
                padding:10px;
                background-color:blueviolet;
                gap:10px;
            }
            .c{
                border: solid 2px green;
                padding:15px;
                background-color: yellowgreen;
            }
		</style>
	</head>
	<body>
		<div class="P">
			<div class="c">THIS IS HEADER</div>
			<div class="c">THIS IS NAVIGATION</div>
			<div class="c">THIS IS MAIN MENU</div>
			<div class="c"> THIS IS SIDE MENU</div>
			<div class="c"> THIS IS FOOTER</div>
        </div>
	</body>
</html>
