<!DOCTYPE html>
<html>
    <head>
        <title>textshadow</title>
        <style>
            .text{
                font-size:50px;
                text-shadow:10px 10px 5px green,
                -10px -10px 5px blueviolet,
                10px -10px -5px brown,
                -10px 10px 5px purple;
            }

        </style>
        </title>
    </head>
    <body>
        <p class="text">HELLO</p>

    </body>
</html>
