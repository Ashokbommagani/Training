<!DOCTYPE html>
<html>
    <head>
        <title>multiple box shadow</title>
        <style>
            .box{
                width: 50px;
                height:50px;
                padding:10;
                border:solid 2px black;
                box-shadow:10px 10px 5px 0px blue,
                -10px -10px -5px 0px greenyellow,
                10px 10px 5px 0px orangered,
                10px 10px 5px 0px green,
                10px 10px 5px 0px purple;
            }
        </style>
        </title>
    </head>
    <body>
        <div class="box">box</div>

    </body>
</html>
