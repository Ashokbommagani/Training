<!DOCTYPE html>
<html>
    <head>
        <title>multiple box shadow</title>
        <style>
            .box{
                width: 250px;
                height:250px;
                padding:10;
                border:solid 2px black;
                box-shadow:
                10px 10px 5px 10px blue,
                -10px -10px 5px 20px greenyellow,
                10px 10px 5px 30px orangered,
                10px 10px 5px 10px green,
                0 0 5px 40px purple;
            }
        </style>
        </title>
    </head>
    <body>
        <div class="box">box</div>

    </body>
</html>
