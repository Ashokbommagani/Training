<!DOCTYPE html>
<html>
    <head>
        <title>lists css ex</title>
        <style>
            ol{
                list-style-type:upper-roman;
                list-style-position:outside;
                list-style-image:none;
            }

            ul{
            list-style-type:disc;
            list-style-position:outside;
            list-style-image:none;
            }
        </style>
    </head>
    <body>
        <ol>
            <li>one</li>
            <li>two</li>
            <li>three</li>
        </ol>
        <ul>
            <li>six</li>
            <li>seven</li>
            <li>eight</li>
        </ul>
    </body>
