<!DOCTYPE html>
<html>
	<head>
		<title>lists css example</title>
		<style>
			ol{
				list-style-position:inside;
				list-style-image:url("myphoto.jpg");
			   }
			ul{
			list-style-type:square;
			list-style-position:outside;
			list-style-image:none;
			}
		</style>
	</head>
	<body>
		<ol>
			<li>AAA</li>
			<li>AAA</li>
			<li>AAA</li>
		</ol>
		<ul>
			<li>BBB</li>
			<li>BBB</li>
			<li>BBB</li>
		</ul>
	</body>
</html>
