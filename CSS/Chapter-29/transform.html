<!DOCTYPE html>
<html>
	<head>
		<title>css transform</title>
		<style>
			.box{
				border:solid 2px blue;
				padding:10px;
				height:200px;
				width:200px;
				background-color:green;
				transition-property:transform;
				transition-duration:10s;
				transition-timing-function:ease;
			}
			.box:hover{
				transform: scale(2);
			}
		</style>
	</head>
	<body>
		<div class="box"> BOX</div>
	</body>
</html>
