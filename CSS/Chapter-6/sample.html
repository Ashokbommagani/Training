<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders - Chapter 6.1</title>

    <style>
        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
            justify-content:center;
        }

        .box{
            width:250px;
            padding:20px;
            background:white;
            text-align:center;
        }

        /* Border Styles */
        .solid{
            border:3px solid black;
        }

        .dashed{
            border:3px dashed blue;
        }

        .dotted{
            border:3px dotted red;
        }

        .double{
            border:5px double green;
        }

        /* Border Width */
        .thick-border{
            border-style:solid;
            border-width:8px;
            border-color:purple;
        }

        /* Border Color */
        .color-border{
            border:4px solid;
            border-color:red green blue orange;
        }

        /* Border Radius */
        .rounded{
            border:3px solid #3498db;
            border-radius:20px;
        }

        /* Individual Borders */
        .individual{
            border-top:4px solid red;
            border-right:4px dashed green;
            border-bottom:4px dotted blue;
            border-left:4px double orange;
        }

        /* Border Shorthand */
        .shorthand{
            border:4px solid #9b59b6;
            border-radius:15px;
        }

        /* Circle */
        .circle{
            width:120px;
            height:120px;
            background:lightblue;
            border:4px solid #333;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            margin:auto;
            font-weight:bold;
        }

        /* Card Example */
        .card{
            width:300px;
            background:white;
            border:1px solid #ddd;
            border-radius:12px;
            padding:20px;
        }

        .card h2{
            border-bottom:2px solid #3498db;
            padding-bottom:10px;
        }

        .card button{
            border:2px solid #3498db;
            border-radius:6px;
            padding:10px 20px;
            background:white;
            color:#3498db;
            cursor:pointer;
        }

        .card button:hover{
            background:#3498db;
            color:white;
        }
    </style>
</head>
<body>

    <h1>CSS Borders Demonstration</h1>

    <div class="container">

        <div class="box solid">
            Solid Border
        </div>

        <div class="box dashed">
            Dashed Border
        </div>

        <div class="box dotted">
            Dotted Border
        </div>

        <div class="box double">
            Double Border
        </div>

        <div class="box thick-border">
            Border Width Example
        </div>

        <div class="box color-border">
            Different Border Colors
        </div>

        <div class="box rounded">
            Rounded Border
        </div>

        <div class="box individual">
            Individual Borders
        </div>

        <div class="box shorthand">
            Border Shorthand
        </div>

    </div>

    <br><br>

    <div class="circle">
        Circle
    </div>

    <br><br>

    <div class="card">
        <h2>Product Card</h2>
        <p>
            This card demonstrates practical use of
            border, border-radius and border-bottom.
        </p>
        <button>Read More</button>
    </div>

</body>
</html>
