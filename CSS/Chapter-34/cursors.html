<!DOCTYPE html>
<html>
    <head>
        <title>cursors in css</title>
        <style>
            .container, .box{
                border:solid 2px black;
                padding:10px;

            }
            .box{
                height:100px;
                width:100px;;

            }
            img{
                height:100px;
                width:100px;
            }
            .container{
                display:grid;
                grid-template-columns: repeat(3,1fr);
                gap:10px;
                height:500px;
                width:500px;
            }
            .box1 img{
                cursor:pointer;
            }
            .box2 img{
                cursor:crosshair;
            }
            .box3 img{
                cursor:zoom-in;
            }
            .box4 img{
                cursor:zoom-out;
            }
            .box5 img{
                cursor:not-allowed;
            }
            .box6 img{
                cursor:wait;
            }
            .box7 img{
                cursor:url("hanuman.jpg"),auto;
            }

        </style>
    </head>
    <body>
        <div class="container">
            <div class="box box1">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box2">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box3">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box4">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box5">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box6">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box7">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box8">
                <img src="nature.jpg" alt="nature" />
            </div>
            <div class="box box9">
                <img src="nature.jpg" alt="nature" />
            </div>
        </div>
    </body>
</html>
