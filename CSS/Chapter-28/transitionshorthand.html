<!DOCTYPE html>
<html>
    <head>
        <title>transition shorthand</title>
        <style>
            img{
                transition:all 5s ease-in 2s;
            }
            img:hover{
                background-color: brown;
                width:200px;
                height:300px;
            }
        </style>
    </head>
    <body>
        <img src="ganesh.jpg" alt=" lord ganesh" />
    </body>
</html>
