<!DOCTYPE html>
<html>
	<head>
		<title>css transitions</title>
		<style>
		.box{
			border:solid 3px orangered;
			padding:10px;
			width:100px;
			height:200px;
			transition-property:all;
			transition-duration:10s;
		}
		.box:hover{
			width:200px;
			height:300px;
			background-color:green;
			text-decoration-color: blue;
			
		}
		</style>
	</head>
	<body>
		<div class="box">BOX</div>
	</body>
</html>
