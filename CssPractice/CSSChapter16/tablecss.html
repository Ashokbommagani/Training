<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2 {
            text-align: center;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 450px;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #2563eb;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #dbeafe;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Student Marks</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>101</td>
                    <td>Ravi</td>
                    <td>HTML</td>
                    <td>85</td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Priya</td>
                    <td>CSS</td>
                    <td>92</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Arun</td>
                    <td>JavaScript</td>
                    <td>78</td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>Meena</td>
                    <td>HTML</td>
                    <td>88</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
