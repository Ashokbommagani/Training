<!DOCTYPE html>
<html>
    <head>
        <title>borders in css</title>
        <style>
            .box{
                border:solid 2px blue;
                border-radius:50%;
                padding:10px;
                height:500px;
                width:500px;
                background-color:green;
            }
            .box1{
                border-style:solid dotted double dashed;
                border-width:thin medium thick 5px;
                background-color:red green blue yellow;
                padding:10px;
                width:100px;
                height:100px;
                border-radius:35%;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="box1">box1</div>
        </div>
    </body>
</html>
