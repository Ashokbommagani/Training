<!DOCTYPE html>
<html>
<head>
    <title>Border Style Example</title>

    <style>
        .box {
            width: 250px;
            padding: 15px;
            margin: 10px;
            font-size: 18px;
        }

        .box1 {
            border-style: solid;
            border-width: 3px;
            border-color: blue;
        }

        .box2 {
            border-style: dashed;
            border-width: 3px;
            border-color: red;
        }

        .box3 {
            border-style: dotted;
            border-width: 3px;
            border-color: green;
        }

        .box4 {
            border-style: double;
            border-width: 5px;
            border-color: purple;
        }
    </style>
</head>

<body>

    <h2>CSS Border Style Examples</h2>

    <div class="box box1">
        Solid Border
    </div>

    <div class="box box2">
        Dashed Border
    </div>

    <div class="box box3">
        Dotted Border
    </div>

    <div class="box box4">
        Double Border
    </div>

</body>
</html>
