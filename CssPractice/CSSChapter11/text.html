<!DOCTYPE html>
<html>
    <head>
        <title>text in css</title>
        <style>
            p{
                color:#cccc;
                text-align:justify;
                text-decoration:none;
                text-transform:uppercase;
                text-indent:300px;
                letter-spacing:5px;
                word-spacing:10px;
                line-height:10px;
                text-shadow:2px 2px 0px red;
                background-color:yellow;
                border:solid 5px green;
                padding:10px;
                height:30%;
                width:30%;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis;
            }
        </style>
    </head>
    <body>
        <p>text color pink</p>
        <p> welcome background yellow</p>
    </body>
</html>
