<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body style="background-color: #f5f5f5; font-family: Arial, sans-serif;">

    <h1 style="color: blue; text-align: center;">
        Welcome to CSS
    </h1>

    <p style="color: green; font-size: 20px; text-align: center;">
        Learning CSS is easy and fun.
    </p>

    <div style="text-align: center;">
        <button style="
            background-color: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;">
            Click Me
        </button>
    </div>

</body>
</html>
