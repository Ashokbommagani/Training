<!DOCTYPE html>
<html>
	<head>
		<title>four ways to add css</title>
        <link rel="stylesheet" href="externalstyle.css">
		<style>
			:root{
            --primary-color: red;
        }
			.btn{
				color:(--primary-color);
			}
			#internal{
				color:rgb(255,0,0);
                font-size:36px;
			}
            /* variable is used for create once reuse unlimited */
				</style>
	<body>
		<p style="color:green;font-size:20px">1.inline css is best for single element</p>
		<h3 id="internal" !important>2internal css is best for single webpage</h3>
        <h4>3.External css is best for large projects we need to use link in head section to link html to css files</h4>
        <h5>4.import is used for modular development it is mainly used for combine css files in one </h5>
		<button class="btn">variable</button>
	</body>
</html>
