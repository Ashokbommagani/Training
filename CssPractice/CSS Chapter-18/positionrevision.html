<!DOCTYPE html>
<html>
	<head>
		<title>css position revision</title>
		<style>
			.box{
				border:solid 2px black;
				padding:10px;
				margin:10px;
				height:100px;
				width:100px;
			}
			.box1{
				position:static;
				top:10px;
				left:20px;
			}
			.box2{
				position:relative;
				top:15px;
				left:20px;
			}
			.box3{
				position:absolute;
				top:50px;
				left:50px;
			}
			.box4{
				position:fixed;
				top:0;
			}
			.box5{
				position:sticky;
				top:0;
				background-color:green;
				padding:10px;
			}
			.box6{
				position:static;/* default position with out mentioning also it will apply */
			}
		</style>
	</head>
	<body>
		<div class="box box1">box1</div>
		<div class="box box2">box2</div>
		<div class="box box3">box3</div>
		<div class="box box4">box4</div>
		<div class="box box5">box5</div>
		<div class="box box6">box6</div>
	</body>
</html>
