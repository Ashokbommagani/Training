<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors - Chapter 3</title>

    <style>
        /* 1. Universal Selector */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 2. Element Selector */
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #333;
            line-height: 1.6;
        }

        h2 {
            color: blue;
            margin-bottom: 10px;
        }

        /* 3. ID Selector */
        #header {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* 4. Group Selector */
        h1, h2, button {
            font-family: Arial, sans-serif;
        }

        /* 5. Descendant Selector */
        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        /* 6. Child Selector */
        nav > a {
            display: inline-block;
            padding: 8px;
        }

        /* Navigation */
        nav {
            background: #2563eb;
            text-align: center;
        }

        /* 7. Adjacent Sibling Selector */
        h2 + p {
            color: #475569;
        }

        /* 8. General Sibling Selector */
        h2 ~ p {
            line-height: 1.8;
        }

        /* 9. Class Selector */
        .card {
            background: white;
            width: 90%;
            max-width: 650px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #cbd5e1;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            margin: 5px;
        }

        /* 10. Attribute Selectors */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        input[required] {
            border-left: 4px solid blue;
        }

        input[type="password"] {
            background: lightyellow;
        }

        /* 11. Pseudo Classes */
        .btn:hover {
            background: darkblue;
        }

        input:focus {
            outline: 2px solid #60a5fa;
        }

        li:first-child {
            color: red;
        }

        li:last-child {
            color: green;
        }

        li:nth-child(2) {
            color: blue;
        }

        input:disabled {
            background: lightgray;
        }

        /* 12. Pseudo Elements */
        h2::before {
            content: "★ ";
            color: orange;
        }

        h2::after {
            content: " ✓";
            color: green;
        }

        p::first-letter {
            font-size: 24px;
            font-weight: bold;
        }

        input::placeholder {
            color: gray;
        }

        ::selection {
            background: yellow;
            color: black;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .card {
                width: 95%;
                padding: 15px;
            }

            nav a {
                margin: 4px;
            }
        }
    </style>
</head>

<body>

    <header id="header">
        <h1>Student Portal</h1>
        <p>Learn HTML and CSS</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#profile">Profile</a>
        <a href="#courses">Courses</a>
    </nav>

    <main id="home">

        <section class="card">
            <h2>Welcome</h2>
            <p>Learn CSS selectors with this practical example.</p>
            <button class="btn">View Profile</button>
            <button class="btn">Learn More</button>
        </section>

        <section id="profile" class="card">
            <h2>Student Details</h2>
            <p>Name: Rahul</p>
            <p>Course: Python Full Stack</p>
            <p>Level: Beginner</p>
        </section>

        <section id="courses" class="card">
            <h2>My Courses</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <section class="card">
            <h2>Contact Us</h2>
            <form>
                <input type="text"
                       placeholder="Enter your name"
                       required>

                <input type="email"
                       placeholder="Enter your email"
                       required>

                <input type="password"
                       placeholder="Enter password">

                <button type="submit" class="btn">
                    Submit
                </button>
            </form>
        </section>

    </main>

    <footer>
        <p>Chapter 3 - CSS Selectors Practice</p>
    </footer>

</body>
</html>
