<!DOCTYPE html>
<html>
<head>
    <title>Introduction to CSS</title>

    <style>
        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background-color: #0077cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Content Section */
        .content {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px gray;
        }

        h2 {
            color: #0077cc;
        }

        p {
            font-size: 18px;
            color: #444;
        }

        /* Button */
        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        /* Footer */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning CSS Fundamentals</p>
    </header>

    <div class="content">
        <h2>What is CSS?</h2>
        <p>
            CSS (Cascading Style Sheets) is used to style and design web pages.
            It controls colors, fonts, layouts, spacing, and animations.
        </p>

        <button>Learn More</button>
    </div>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
