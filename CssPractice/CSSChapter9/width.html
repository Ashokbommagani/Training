<!DOCTYPE html>
<html>
    <head>
        <title>width and height in css</title>
        <style>
            .box{

                border: solid 2px black;
                padding: 20px;
            }
           
            .box1{
                width: 20%;
                max-width: 100px;
                min-width: 100px;
            }
            .box2{
                width: 20%;
                max-width: 200px;
                min-width: 100px;
            }
            .box3{
                width: 20%;
                max-width: 300px;
                min-width: 100px;
            }
            .box4{
                width: 20%;
                max-width: 400px;
                min-width: 100px;
            }
            .box5{
                width: 20%;
                max-width: 500px;
                min-width: 100px;
            }

            .box6{
                width: 20%;
                max-width: 600px;
                min-width: 50px;
            }
        </style>
    </head>
    <body>
        <p class="box box1"> welcome height and width in css</p>
        <p class="box box2"> welcome height and width in css</p>
        <p class="box box3"> welcome height and width in css</p>
        <p class="box box4"> welcome height and width in css</p>
        <p class="box box5"> welcome height and width in css</p>
        <p class="box box6"> welcome height and width in css</p>
    </body>
</html>
