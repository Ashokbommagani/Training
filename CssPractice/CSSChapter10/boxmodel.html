<!DOCTYPE html>
<html>
    <head>
        <style>
            .box{

                border: solid 2px black;
                padding: 20px;
                width: 100px;
                height: 100px;
            }

            .box1{
                box-sizing: border-box;
            }
            .box2{
                box-sizing: content-box;
            }
            .box3{
                box-sizing: border-box;
            }
            .box4{
                box-sizing: content-box;
            }
            .box5{
                box-sizing: border-box;
            }
            .box6{
                box-sizing: content-box;
            }
        </style>        
    </head>
    <body>
        <img class="box box1" src="" alt="" />
        <img class="box box2" src="" alt="" />
        <img class="box box3" src="" alt="" />
        <img class="box box4" src="" alt="" />
        <img class="box box5" src="" alt="" />
        <img class="box box6"src="" alt="" />
    </body>
</html>
