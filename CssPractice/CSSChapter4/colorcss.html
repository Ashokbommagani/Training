<!DOCTYPE html>
<html>
<head>
    <title>CSS Color Names Example</title>
    <style>
        body{
            background-color: white;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1{
            color: blue;
        }

        p{
            color: green;
            font-size: 20px;
        }

        button{
            background-color: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS Colors</h1>

    <p>This paragraph is displayed in green color.</p>

    <button>Click Me</button>

</body>
</html>
