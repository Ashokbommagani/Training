<!DOCTYPE html>
<html>
	<head>
		<title>colors in css</title>
		<style>
			h1{
				color:red;
			}
			h2{
				color:rgb(0,0,255);
			}
			h3{
				color:rgba(0,255,0,1);
			}
			h4{
				color:#AABBEE;
			}
            H5{
                opacity:1;
            }
	
		</style>
	</head>
	<body>
		<h1>1.color names</h1>
		<h2>2.rgb color</h2>
		<h3>3.rgb alpha color</h3>
		<h4>4.hexa decimal color</h4>
        <H5>5.OPACITY COLOR</H5>
		
	</body>
</html>
