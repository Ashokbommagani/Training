<!DOCTYPE html>
<html>
<head>
    <title>CSS Margin Properties Example</title>

    <style>
        .box {
            width: 250px;
            height: 120px;
            background-color: lightblue;
            border: 2px solid blue;

            /* Individual Margin Properties */
            margin-top: 20px;
            margin-right: 30px;
            margin-bottom: 40px;
            margin-left: 50px;

            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="box">
        This box demonstrates all four margin properties.
    </div>

</body>
</html>
