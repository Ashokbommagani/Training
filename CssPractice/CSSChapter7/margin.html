<!DOCTYPE html>
<html>
    <head>
        <title>margins in css</title>
        <style>
            h1,.page1,.page2{
                border:solid 2px #324;
                padding:10px;
                margin:70px;
            }
            .page1,.page2{
                height:150px;
                width:250px;
                color:red;
                background-color:#777;
                margin-top:30px;
                margin-left:20px;
            }
            .book{
                margin:10px 20px 30px 40px;
            }

        </style>
    </head>
    <body>
        <h1 class="book">
            <P class="page1">index</P>
            <p class="page2">introduction</p>
        </h1>
    </body>
</html>
