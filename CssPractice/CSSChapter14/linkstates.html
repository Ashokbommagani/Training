<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Links Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        a:link {
            color: blue;
            text-decoration: none;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: red;
            text-decoration: underline;
        }

        a:active {
            color: green;
            background-color: lightyellow;
        }

        div a {
            display: inline-block;
            padding: 10px;
            margin:10px;
            border-radius: 4px;
        }

        div a:hover {
            background-color: #eeeeee;
        }
        .box{
            border:solid 2px green;
            padding:10px;
        }
    </style>
</head>
<body>

    <h1>CSS Link States</h1>

    <p class="box">
        <a href="https://www.google.com">Google</a>
    </p
    <div class="box">
        <a href="https://www.wikipedia.org">Wikipedia</a>
    </div>
    <div class="box">
        <a href="https://www.mozilla.org">Mozilla</a>
    </div>
    <p>Move your pointer over a link to see the hover effect.</p>
    <p>Press and hold a link to see the active effect.</p>
    <p>Visited links may appear purple when you return to this page.</p>

</body>
</html>
