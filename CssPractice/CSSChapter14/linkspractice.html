<!DOCTYPE html>
<html>
    <head>
        <title>css links</title>
        <style>
            div{
                border:solid 2px black;
                padding:10px;
                margin:10px;
                width:100px;
                height:100px;
            }
            a:link{
                color:orangered;
            }
            a:hover{
                color: blue;
            }
            a:active{
                color:palevioletred;
            }
            a:visited{
                color:peru;
            }
        </style>
    </head>
    <body>
        <div>
            1.link
            <a href="https://www.google.com">Visit Google</a>
            <a href="https://www.wikipedia.org">Visit Wikipedia</a>  
        </div>
        <div>
            2.hover
             <a href="https://www.youtube.com">Visit youtube</a> 
        </div>
        <div>
            3.active
             <a href="https://www.facebbok.com">Visit facebook</a>

        </div>
        <div>
            4.visited
            <a href="https://www.w3schools.com">Visit w3 schools</a>
            <a href="https://www.tutorialpoint.com">Visit tutorialpoint</a>
            <a href="https://www.javatpoint.com">Visit javatpoint</a>

        </div>

    </body>
</html>
