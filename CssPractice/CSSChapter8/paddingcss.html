<!DOCTYPE html>
<html>
<head>
    <title>CSS Padding Example</title>

    <style>
        .box {
            width: 300px;
            border: 2px solid black;

            /* Individual Padding Properties */
            padding-top: 10px;
            padding-right: 20px;
            padding-bottom: 30px;
            padding-left: 40px;

            background-color: lightblue;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h2>CSS Padding Example</h2>

    <div class="box">
        This box demonstrates padding-top, padding-right,
        padding-bottom, and padding-left properties.
    </div>

</body>
</html>
