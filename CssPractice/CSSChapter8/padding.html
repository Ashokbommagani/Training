<!DOCTYPE html>
<html>
    <head>
        <title> padding in css</title>
        <style>
            div{
                border:solid 3px blue;
                width:300px;
                height:100px;
                margin:20px;
                background-color:green;
            }
            .box1{/* all sides*/ 
                padding:10px;
            }
            .box2{/*2 sides top
                padding:10px 20px;
                
            }
            .box3{
                padding:10px 20px 30px;
            }
            .box4{
                padding:10px 20px 30px 40px;
            }
            .box5{
                padding-top:20px;
            }
            .box6{
                padding-left:30px;
            }
            .box7{
                padding-bottom:40px;
            }
            .box8{
                padding-right:30px;
            }

        </style>
    </head>
    <body>
        <div class="box box1">
            BOX1 1 value
        </div>
        <div class="box box2">
            BOX2 2 values
        </div>
        <div class="box box3">
            BOX3 3 values
        </div>
        <div class="box box4">
            BOX4 4 values
        </div>
        <div class="box box5">
            BOX5 top
        </div>
        <div class="box box6">
            BOX6 left
        </div>
        <div class="box box7">
            BOX7 bottom
        </div>
        <div class="box box8">
            BOX8 right
        </div>
        <div class="box box9">
            BOX9
        </div>
        <div class="box box10">
            BOX10
        </div>
        <div class="box box11">
            BOX11
        </div>
    </body>
</html>
