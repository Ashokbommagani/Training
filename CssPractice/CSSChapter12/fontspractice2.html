<!DOCTYPE html>
<html>
    <head>
        <title>fonts in css</title>
        <style>
            .box{
                border:solid 2px green;
                padding:15px;
                width:100px;
                height:100px;
            }
            .box1{
                color:pink;
                font-size:larger;
                font-weight:100;
                font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif
                font-style: italic;
            }
            .box2{
                color:yellow;
                font-size:small;
                font-weight:200;
                font-family:Arial, Helvetica, sans-serif;
                font-style: italic;
            }
            .box3{
                color:black;
                font-size:smaller;
                font-weight:300;
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-style: italic;
            }
            .box4{
                color:purple;
                font-size:xx-larger;
                font-weight:400;
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-style:oblique;
            }
            .box5{
                color:olive;
                font-size:larger;
                font-weight:500;
                font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                font-style: italic;
            }
            .box6{
                color:pink;
                font-size:large;
                font-weight:600;
                font-family: 'Courier New', Courier, monospace;
                font-style:normal;
            }
        </style>
    </head>
    <body>
        <p class="box box1">fonts revision</p>
        <p class="box box2">fonts revision</p>
        <p class="box box3">fonts revision</p>
        <p class="box box4">fonts revision</p>
        <p class="box box5">fonts revision</p>
        <p class="box box6">fonts revision</p>
    </body>
</html>
