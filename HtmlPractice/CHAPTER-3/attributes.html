<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HTML Attributes</title>
        <style>
            .heading {
                color: blue;
            }

            .highlight {
                background-color: yellow;
            }
        </style>
    </head>

    <body>
        <h1
            id="main-heading"
            class="heading"
            title="Main page heading"
        >
            HTML Attributes
        </h1>

        <p
            id="intro"
            class="highlight"
            lang="en"
            dir="ltr"
        >
            HTML attributes provide additional
            information about HTML elements.
        </p>
        <button
            title="Click this button"
            style="background-color: green; color: white;"
        >
            Click Me
        </button>
    </body>

</html>
