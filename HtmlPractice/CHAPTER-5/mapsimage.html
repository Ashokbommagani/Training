<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Image Map</title>
</head>

<body>

    <h1>Image Map Example</h1>

    <img
        src="map.png"
        alt="Interactive map"
        usemap="#my-map"
    >

    <map name="my-map">

        <area
            shape="rect"
            coords="0,0,200,150"
            href="north.html"
            alt="North Region"
        >

        <area
            shape="circle"
            coords="300,200,50"
            href="south.html"
            alt="South Region"
        >

    </map>
</body>
</html>
