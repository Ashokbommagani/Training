<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>

        /* General page styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
        }

        /* Responsive table container */
        .table-container {
            overflow-x: auto;
            max-width: 100%;
        }

        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        caption {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #222;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        /* Table header */
        thead th {
            background-color: #333;
            color: white;
        }

        /* Alternate row colours */
        tbody tr:nth-child(even) {
            background-color: #e8e8e8;
        }

        tbody tr:nth-child(odd) {
            background-color: #fff;
        }

        /* Footer styling */
        tfoot {
            background-color: #d5e8ff;
            font-weight: bold;
        }

        /* Highlight passed students */
        .pass {
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>Student Management System</h1>

    <p>HTML Full Stack Development Course</p>

    <div class="table-container">

        <table>

            <!-- Table title -->
            <caption>Student Marks Report</caption>

            <!-- Header section -->
            <thead>

                <tr>
                    <th rowspan="2" scope="col">
                        Student ID
                    </th>

                    <th rowspan="2" scope="col">
                        Student Name
                    </th>

                    <th colspan="3" scope="colgroup">
                        Subject Marks
                    </th>

                    <th rowspan="2" scope="col">
                        Result
                    </th>
                </tr>

                <tr>
                    <th scope="col">HTML</th>
                    <th scope="col">CSS</th>
                    <th scope="col">Python</th>
                </tr>

            </thead>

            <!-- Main data section -->
            <tbody>

                <tr>
                    <th scope="row">101</th>
                    <td>Ashok</td>
                    <td>95</td>
                    <td>90</td>
                    <td>92</td>
                    <td class="pass">Pass</td>
                </tr>

                <tr>
                    <th scope="row">102</th>
                    <td>Ravi</td>
                    <td>85</td>
                    <td>88</td>
                    <td>90</td>
                    <td class="pass">Pass</td>
                </tr>

                <tr>
                    <th scope="row">103</th>
                    <td>Hari</td>
                    <td>80</td>
                    <td>75</td>
                    <td>85</td>
                    <td class="pass">Pass</td>
                </tr>

                <tr>
                    <th scope="row">104</th>
                    <td>Priya</td>
                    <td>90</td>
                    <td>95</td>
                    <td>98</td>
                    <td class="pass">Pass</td>
                </tr>

            </tbody>

            <!-- Summary section -->
            <tfoot>

                <tr>
                    <th colspan="2">
                        Total Students
                    </th>

                    <td colspan="4">
                        4 Students
                    </td>
                </tr>

                <tr>
                    <th colspan="2">
                        Maximum Marks
                    </th>

                    <td colspan="4">
                        300 Marks
                    </td>
                </tr>

            </tfoot>

        </table>

    </div>

</body>
</html>
