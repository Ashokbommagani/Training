<!DOCTYPE html>
<html>
   <head>
        <title>Table with Head Body and Footer</title>
    </head>
    <body>
        <table>
            <caption>Employee Salary Report</caption>
            <thead>
                <tr>
                    <th>Emp ID</th>
                    <th>Name</th>
                    <th>Salary</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>101</td>
                    <td>John Doe</td>
                    <td>50,000</td>
                </tr>
                <tr>
                    <td>102</td>
                    <td>Ravi</td>
                    <td>60,000</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th col span="2">Total</th>
                    <th>110,000</th>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
