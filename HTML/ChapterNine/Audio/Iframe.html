<!DOCTYPE html>
<html>
    <head>
        <title>My Iframe</title>
    </head>
    <body>
        <h1><mark>Iframe YouTube Embed</mark></h1>
        <iframe
             width="560"
            height="315"
            src="https://www.youtube.com/embed/8GgTogVBjRo?si=1JHx0oK_USfUUkYG" 
            title="YouTube video player">
        </iframe>
        <h1><mark>Iframe PDF Embed</mark></h1>
        <iframe
            width="560"
            height="315"
            src="Ramakrishna.pdf" 
            title="Document PDF">
        </iframe>
        <h1><mark>Iframe Audio html file Embed</mark></h1>
        <iframe
            width="560"
            height="315"
            src="Audio.html"
            title="Audio HTML"> 
        </iframe>
        <h1><mark>MAPS</mark></h1>
        <iframe 
            src="https://maps.google.com/maps?width=600&amp;height=400&amp;hl=en&amp;q=2880 Broadway, New York&amp;t=&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"
            height="300"
            width="200">  
         </iframe>
         <h1><Mark>DISPLAY HTML PAGES</h1>
         <iframe
            src="index.html"
             name="myframe"     
             width="600"
             height="300"
             title="Page Display">
            </iframe>
    </body>
</html>
