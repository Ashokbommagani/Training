<!DOCTYPE html>
<html>
    <head>
        <title>Order and Unordered List Example</title>
    </head>
    <body>
        <h1>Programming Languages</h1>
        <h2>Unordered List</h2>
        <ul>
            <li>HTML</li>
            <li>css</li>
            <li>JavaScript</li>
            <li>PHP</li>
        </ul>
        <h2>Ordered List</h2>
        <ol>
            <li>open the website</li>
            <li>enter username</li>
            <li>enter password</li>
            <li>click login</li>
            <li>Home page Opens</li>
        </ol>
    </body>
</html>
